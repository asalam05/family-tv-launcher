name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install SQLite
        run: |
          sudo apt-get update
          sudo apt-get install -y sqlite3 libsqlite3-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > android/release-key.jks

      - name: Build APK
        env:
          KEYSTORE_FILE: "../release-key.jks"
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          UNIVERSAL_ONLY: "true"
        run: |
          flutter build apk --release \
            --target-platform=android-arm,android-arm64 \
            --build-name=1.0.${{ github.run_number }} \
            --build-number=$((10000 + ${{ github.run_number }}))
          mkdir -p dist
          find build/app/outputs -name "*.apk" | sort
          APK=$(find build/app/outputs -name "*release*.apk" | grep -E "app-release|universal" | head -1)
          cp "$APK" dist/FamilyTV.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FamilyTV-apk
          path: dist/FamilyTV.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Family TV 1.0.${{ github.run_number }}
          body: |
            Automatic build of commit ${{ github.sha }}.
            Install on the TV with: `adb install -r FamilyTV.apk`
          files: dist/FamilyTV.apk
          make_latest: true
